<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>小星球三维查看</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fdfcf9;
        --paper-soft: rgba(253, 252, 249, 0.86);
        --ink: #2f2b2a;
        --muted: #756d69;
        --line: rgba(47, 43, 42, 0.2);
        --accent: #a77878;
        --accent-soft: rgba(167, 120, 120, 0.13);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --paper: #201d1c;
        --paper-soft: rgba(32, 29, 28, 0.88);
        --ink: #f0eae5;
        --muted: #b9aaa3;
        --line: rgba(240, 234, 229, 0.21);
        --accent: #d1a0a0;
        --accent-soft: rgba(209, 160, 160, 0.14);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: ui-serif, "Songti SC", "STSong", Georgia, serif;
      }
      .viewer { position: relative; width: 100%; height: 100%; min-height: 280px; isolation: isolate; }
      .viewer::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
        background:
          radial-gradient(circle at 50% 42%, var(--accent-soft), transparent 42%),
          linear-gradient(180deg, color-mix(in srgb, var(--paper) 96%, var(--accent)), var(--paper));
      }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      canvas:focus-visible { outline: 1px solid var(--accent); outline-offset: -4px; }
      .status {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        max-width: calc(100% - 32px);
        margin: 0;
        padding: 6px 10px;
        transform: translateX(-50%);
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper-soft);
        color: var(--muted);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        font-size: 12px;
        line-height: 1.35;
        letter-spacing: 0.04em;
        text-align: center;
        backdrop-filter: blur(8px);
        transition: opacity 180ms ease;
      }
      .is-ready .status { opacity: 0; pointer-events: none; }
      .controls {
        position: absolute;
        right: 14px;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
        pointer-events: none;
      }
      button {
        min-height: 32px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper-soft);
        color: var(--ink);
        font: 12px/1 ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        letter-spacing: 0.04em;
        pointer-events: auto;
        backdrop-filter: blur(8px);
        cursor: pointer;
      }
      button:hover, button:focus-visible, button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      button:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
      button:disabled { cursor: wait; opacity: 0.45; }
      [hidden] { display: none !important; }
      .error {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 28px;
        background: var(--paper);
        text-align: center;
      }
      .error strong { font-size: 16px; font-weight: 500; }
      .error span { color: var(--muted); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 13px; }
      .labels { display: none; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      @media (max-width: 520px) {
        .controls { right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); left: 8px; gap: 4px; }
        button { min-height: 30px; padding: 5px 8px; font-size: 11px; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }
    </style>
    <script type="importmap">
      {"imports":{"three":"./vendor/three/0.180.0/build/three.module.js","three/addons/":"./vendor/three/0.180.0/examples/jsm/"}}
    </script>
  </head>
  <body>
    <main class="viewer" id="viewer" aria-busy="true">
      <h1 class="sr-only" id="viewer-title">小星球三维查看</h1>
      <canvas id="canvas" tabindex="0" aria-labelledby="viewer-title" aria-describedby="instructions"></canvas>
      <p class="sr-only" id="instructions">拖动旋转，滚轮或双指缩放。可用下方按钮切换正面、侧面、背面，复位或暂停。</p>
      <p class="status" id="status" role="status" aria-live="polite">正在准备三维小星球…</p>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="controls" id="controls" aria-label="三维查看控制">
        <button type="button" data-view="front" disabled>正面</button>
        <button type="button" data-view="side" disabled>侧面</button>
        <button type="button" data-view="back" disabled>背面</button>
        <button type="button" data-action="reset" disabled>复位</button>
        <button type="button" data-action="turn" aria-pressed="false" disabled>自动转动</button>
        <button type="button" data-action="pause" aria-pressed="false" disabled>暂停</button>
      </div>
      <div class="error" id="error" role="alert" hidden>
        <strong>三维查看暂时不可用</strong>
        <span>这件作品仍可在页面的静态图中观看。刷新后可再次尝试。</span>
      </div>
    </main>
    <script type="module" src="./runtime.js"></script>
  </body>
</html>
